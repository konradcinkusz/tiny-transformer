name: CodeQL

# No `push: branches: [master]` trigger: this repo has GitHub's default code
# scanning setup enabled, which owns push-to-default-branch analysis and
# fails this advanced-setup workflow with a zero-job startup_failure if it
# also tries to run on that event (confirmed on run #2, right after this
# workflow's first merge to master). pull_request coverage (the one that
# actually gates merges) plus the weekly schedule below don't conflict.
on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "24 7 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp", "javascript-typescript"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
